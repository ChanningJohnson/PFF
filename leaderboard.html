/* ════════════════════════════════════════════════════════════════════
   HELPERS & COMPUTED STATS
════════════════════════════════════════════════════════════════════ */
function initials(n){ return n.replace(/^@/,'').split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase(); }
function avatarGrad(n){
  const g=['from-indigo-500 to-purple-600','from-blue-500 to-cyan-600','from-violet-500 to-fuchsia-600','from-sky-500 to-indigo-600','from-purple-500 to-pink-600'];
  let h=0; for(let c of n) h=(h*31+c.charCodeAt(0))&0xffffffff;
  return g[Math.abs(h)%g.length];
}
function pct(rank){ return ((rank/TOTAL_USERS)*100).toFixed(1); }
function tierProgress(rank){
  const cur=getTier(rank); const curIdx=TIER_DEFS.findIndex(t=>t.name===cur.name);
  if(curIdx===0) return {pct:100,cur,next:null};
  const prev=TIER_DEFS[curIdx-1];
  const floor=TIER_DEFS[curIdx].maxRank; const ceil=prev.maxRank;
  const progress=Math.max(0,Math.min(1,1-(rank-ceil-1)/(floor-ceil)));
  return {pct:Math.round(progress*100),cur,next:prev};
}
function spotsToNext(rank){ const n=TIER_DEFS.find(t=>t.maxRank<rank); return n?{tier:n,spots:rank-n.maxRank}:null; }
function fmtOdds(o){ return o>0?`+${o}`:String(o); }
function fmtLine(l){ if(l===null||l===undefined) return '—'; return l>0?`+${l}`:String(l); }

function computeStats(picks){
  const settled=picks.filter(p=>p.outcome!=='pending');
  const wins=settled.filter(p=>p.outcome==='win').length;
  const losses=settled.filter(p=>p.outcome==='loss').length;
  const pushes=settled.filter(p=>p.outcome==='push').length;
  const total=wins+losses;
  const winRate=total>0?Math.round(wins/total*100):0;
  const avgCLV=settled.length>0?(settled.reduce((s,p)=>s+(p.clv||0),0)/settled.length).toFixed(2):0;
  const beatMkt=settled.length>0?Math.round(settled.filter(p=>p.clv>0).length/settled.length*100):0;
  const lineWithUs=settled.length>0?Math.round(settled.filter(p=>p.lineMovedWith).length/settled.length*100):0;
  const ratingGain=settled.reduce((s,p)=>s+(p.ratingDelta||0),0).toFixed(1);
  return {wins,losses,pushes,total:settled.length,winRate,avgCLV,beatMkt,lineWithUs,ratingGain};
}

function computeSplits(picks,key,values){
  return values.map(val=>{
    const sub=picks.filter(p=>p[key]===val&&p.outcome!=='pending');
    const w=sub.filter(p=>p.outcome==='win').length;
    const l=sub.filter(p=>p.outcome==='loss').length;
    const push=sub.filter(p=>p.outcome==='push').length;
    const clv=sub.length>0?(sub.reduce((s,p)=>s+(p.clv||0),0)/sub.length).toFixed(2):null;
    const wr=w+l>0?Math.round(w/(w+l)*100):null;
    return {val,w,l,push,n:sub.length,wr,clv:clv!==null?parseFloat(clv):null};
  }).filter(r=>r.n>0);
}

/* Credibility badges */
function computeBadges(picksCount, stats){
  const badges=[];
  if(picksCount>=10)  badges.push({key:'b10',  label:'10+ Picks',  icon:'📋', desc:'First step onto the record'});
  if(picksCount>=50)  badges.push({key:'b50',  label:'50+ Picks',  icon:'📊', desc:'Building a real sample'});
  if(picksCount>=100) badges.push({key:'b100', label:'100+ Picks', icon:'🔢', desc:'Minimum for tier ranking'});
  if(picksCount>=250) badges.push({key:'b250', label:'250+ Picks', icon:'📈', desc:'Statistically meaningful'});
  if(picksCount>=500) badges.push({key:'b500', label:'500+ Picks', icon:'🏛', desc:'Deep long-run sample'});
  if(stats.beatMkt>=55) badges.push({key:'clv', label:'Positive CLV', icon:'📡', desc:'Beating the market long-run'});
  if(stats.winRate>=60 && stats.total>=50) badges.push({key:'wr60', label:'60%+ Win Rate', icon:'🎯', desc:'Consistent winner'});
  badges.push({key:'lock', label:'Verified Record', icon:'🔒', desc:'All picks timestamped & locked'});
  return badges;
}

function Avatar({name,size='md',isMe=false}){
  const sz={sm:'w-9 h-9 text-xs',md:'w-10 h-10 text-sm',lg:'w-14 h-14 text-base',xl:'w-16 h-16 text-lg'}[size];
  const g=isMe?'from-indigo-500 to-indigo-700':avatarGrad(name);
  return <div className={`${sz} rounded-full bg-gradient-to-br ${g} flex items-center justify-center font-bold text-white flex-shrink-0 ${isMe?'ring-me':''}`}>{isMe?'★':initials(name)}</div>;
}

function SmartBadge({rating,size='sm'}){
  const s=size==='lg'?{l:'text-[10px]',sub:'text-[6.5px]',n:'text-2xl'}:{l:'text-[8px]',sub:'text-[5.5px]',n:'text-base'};
  return <div className="flex items-center gap-1.5 flex-shrink-0">
    <div className="flex flex-col leading-none">
      <span className={`font-black text-white ${s.l}`} style={{letterSpacing:'0.14em'}}>SMART</span>
      <span className={`font-semibold text-slate-400 ${s.sub}`} style={{letterSpacing:'0.08em'}}>RATING SYSTEM</span>
    </div>
    <span className={`text-white font-black ${s.n}`}>{rating}</span>
  </div>;
}

function TierPill({tierName,small=false}){
  const def=TIER_DEFS.find(t=>t.name===tierName)||TIER_DEFS[TIER_DEFS.length-1];
  const cls=small?'text-[9px] px-1.5 py-0.5':'text-xs px-2 py-0.5';
  return <span className={`rounded font-bold ${cls}`} style={{color:def.color,background:def.bg,border:`1px solid ${def.color}40`}}>{tierName}</span>;
}

function MovTag({n}){
  if(!n||n===0) return <span className="text-slate-600 text-xs">—</span>;
  return <span className={`text-xs font-semibold ${n>0?'text-emerald-400':'text-rose-400'}`}>{n>0?'↑':'↓'}{Math.abs(n)}</span>;
}

function LockIcon({locked}){
  return locked
    ? <span title="Immutable – locked at event start" className="text-emerald-400 text-xs" style={{fontSize:'11px'}}>🔒</span>
    : <span title="Pending – locks at game time" className="text-amber-400 text-xs" style={{fontSize:'11px'}}>⏳</span>;
}

function OutcomePill({outcome}){
  const cfg={win:{bg:'bg-emerald-500/15',text:'text-emerald-400',label:'W'},loss:{bg:'bg-rose-500/15',text:'text-rose-400',label:'L'},push:{bg:'bg-slate-700',text:'text-slate-300',label:'P'},pending:{bg:'bg-amber-500/10',text:'text-amber-400',label:'Pending'}};
  const c=cfg[outcome]||cfg.pending;
  return <span className={`${c.bg} ${c.text} text-[10px] font-bold px-2 py-0.5 rounded-full`}>{c.label}</span>;
}

function CLVTag({clv}){
  if(clv===null||clv===undefined) return <span className="text-slate-600 text-xs">—</span>;
  const pos=clv>0;
  return <span className={`text-xs font-bold ${pos?'text-emerald-400':'clv-neg'}`}>{pos?'+':''}{clv.toFixed(1)}</span>;
}

function SectionHeader({title,sub}){
  return <div className="mb-4">
    <h3 className="text-white font-black text-base">{title}</h3>
    {sub&&<p className="text-slate-400 text-xs mt-0.5">{sub}</p>}
  </div>;
}

function StatBlock({label,value,sub,accent}){
  return <div className="bg-slate-900/60 border border-slate-800 rounded-xl p-4">
    <p className="text-slate-400 text-[10px] font-semibold tracking-wider uppercase mb-1">{label}</p>
    <p className={`font-black text-2xl ${accent||'text-white'}`}>{value}</p>
    {sub&&<p className="text-slate-500 text-[10px] mt-0.5">{sub}</p>}
  </div>;
}

function LBRow({player,onSelect,highlight=false}){

function LogPickPanel({onLogged}){
  const [game,setGame]=useState(''); const [market,setMarket]=useState('');
  const [pick,setPick]=useState(''); const [line,setLine]=useState(''); const [odds,setOdds]=useState('');
  const [done,setDone]=useState(false);
  const sg=TODAY_GAMES.find(g=>g.id===game);
  const sel='w-full bg-slate-800 border border-slate-700 text-white text-sm rounded-xl px-3 py-2.5 focus:outline-none focus:border-indigo-500 transition-colors';
  function submit(e){
    e.preventDefault(); if(!game||!market||!pick.trim()) return;
    setDone(true); setTimeout(()=>{setDone(false);setGame('');setMarket('');setPick('');setLine('');setOdds('');if(onLogged)onLogged();},3500);
  }
  return <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-5">
    <div className="flex items-center gap-2 mb-1"><span className="text-indigo-400">⚡</span><h3 className="text-white font-bold text-sm">Log a Pick</h3></div>
    <p className="text-slate-500 text-xs mb-4">Pick is timestamped on submission and locked immutably at event start. No edits after lock.</p>
    {done
      ? <div className="flex flex-col items-center py-5 gap-2 fade-in">
          <span className="text-3xl">🔒</span>
          <p className="text-white font-bold">Pick logged & timestamped</p>
          <p className="text-slate-400 text-sm">Locked at game time. Expected SMART impact: <span className="text-emerald-400 font-bold">+~1.8</span></p>
        </div>
      : <form onSubmit={submit} className="space-y-2.5">
          <select value={game} onChange={e=>{setGame(e.target.value);setMarket('');}} className={sel}>
            <option value="">Select today's game…</option>
            {TODAY_GAMES.map(g=><option key={g.id} value={g.id}>{g.label}</option>)}
          </select>
          {sg&&<select value={market} onChange={e=>setMarket(e.target.value)} className={sel}>
            <option value="">Market…</option>
            {sg.markets.map(m=><option key={m} value={m}>{m}</option>)}
          </select>}
          {market&&<>
            <input value={pick} onChange={e=>setPick(e.target.value)} placeholder={market==='Spread'?'e.g. Lakers -3.5':market==='Total'?'e.g. Over 214.5':'e.g. Lakers ML'} className={sel}/>
            <div className="grid grid-cols-2 gap-2">
              <input value={line} onChange={e=>setLine(e.target.value)} placeholder="Line (e.g. -3.5)" className={sel}/>
              <input value={odds} onChange={e=>setOdds(e.target.value)} placeholder="Odds (e.g. -110)" className={sel}/>
            </div>
          </>}
          <button type="submit" disabled={!game||!market||!pick.trim()} className="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 disabled:cursor-not-allowed text-white font-bold text-sm transition-colors">
            Log Pick — Immutable at Lock 🔒
          </button>
        </form>}
  </div>;
}

}

function EdgeView(){
  const [period,setPeriod]=useState('all');
  const picks=useMemo(()=>{
    const settled=PICK_LOG.filter(p=>p.outcome!=='pending');
    if(period==='10') return settled.slice(0,10);
    if(period==='30') return settled.slice(0,20);
    return settled;
  },[period]);

  const stats=useMemo(()=>computeStats([...picks,...PICK_LOG.filter(p=>p.outcome==='pending')]),[picks]);
  const sportSplits=useMemo(()=>computeSplits(picks,'sport',['nba','nfl','mlb']),[picks]);
  const mktSplits=useMemo(()=>computeSplits(picks,'market',['Spread','Total','ML']),[picks]);

  const allCLV=picks.filter(p=>p.clv!==null);
  const posCLV=allCLV.filter(p=>p.clv>0).length;
  const lineWith=picks.filter(p=>p.lineMovedWith).length;

  const best=[...sportSplits,...mktSplits].filter(r=>r.wr!==null&&r.n>=3).sort((a,b)=>b.wr-a.wr).slice(0,2);
  const leaks=[...sportSplits,...mktSplits].filter(r=>r.wr!==null&&r.n>=3&&r.clv!==null).sort((a,b)=>(a.clv||0)-(b.clv||0)).slice(0,2);

  const SplitTable=({title,rows})=><div>
    <h4 className="text-slate-400 text-xs font-semibold tracking-wider uppercase mb-2">{title}</h4>
    <div className="rounded-xl border border-slate-800 overflow-hidden">
      <table className="w-full text-xs">
        <thead><tr className="bg-slate-800/40 border-b border-slate-800/60">
          {['Category','W–L','Win %','Avg CLV','Sample'].map(h=><th key={h} className="px-3 py-2 text-left text-slate-500 font-semibold text-[10px] uppercase tracking-wider">{h}</th>)}
        </tr></thead>
        <tbody>{rows.map(r=>{
          const sport=SPORTS.find(s=>s.id===r.val);
          const label=sport?`${sport.icon} ${sport.label}`:r.val;
          return <tr key={r.val} className="border-b border-slate-800/60 last:border-0 hover:bg-white/3">
            <td className="px-3 py-2.5 text-white font-semibold">{label}</td>
            <td className="px-3 py-2.5 text-slate-300">{r.w}–{r.l}{r.push?`–${r.push}P`:''}</td>
            <td className="px-3 py-2.5"><span className={`font-bold ${r.wr>=60?'text-emerald-400':r.wr>=50?'text-white':'text-rose-400'}`}>{r.wr}%</span></td>
            <td className="px-3 py-2.5"><CLVTag clv={r.clv}/></td>
            <td className="px-3 py-2.5 text-slate-400">{r.n} picks{r.n<30&&<span className="text-amber-400 ml-1 text-[9px]">⚠ small</span>}</td>
          </tr>;
        })}</tbody>
      </table>
    </div>
  </div>;

  return <div className="space-y-6 slide-up">
    {/* Period selector */}
    <div className="flex items-center gap-2">
      <span className="text-slate-400 text-xs font-semibold">Period:</span>
      {[['10','Last 10'],['30','Last 20'],['all','All-Time']].map(([v,l])=><button key={v} onClick={()=>setPeriod(v)} className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors ${period===v?'bg-indigo-600 text-white':'bg-slate-800 text-slate-400 hover:text-white'}`}>{l}</button>)}
    </div>

    {/* CLV + Market intel summary */}
    <div>
      <SectionHeader title="Market Intelligence" sub="How your picks compare to closing lines"/>
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4">
        <StatBlock label="Avg CLV" value={`${parseFloat(stats.avgCLV)>0?'+':''}${stats.avgCLV}`} sub="vs closing line" accent={parseFloat(stats.avgCLV)>0?'text-emerald-400':'clv-neg'}/>
        <StatBlock label="Beat Market" value={`${allCLV.length>0?Math.round(posCLV/allCLV.length*100):0}%`} sub="Picks with +CLV" accent={allCLV.length>0&&posCLV/allCLV.length>=0.55?'text-emerald-400':'text-white'}/>
        <StatBlock label="Line Moved With" value={`${picks.length>0?Math.round(lineWith/picks.length*100):0}%`} sub="Market agreed post-entry"/>
        <StatBlock label="Rating Gain" value={`${parseFloat(stats.ratingGain)>0?'+':''}${stats.ratingGain}`} sub="SMART pts total" accent={parseFloat(stats.ratingGain)>0?'text-emerald-400':'clv-neg'}/>
      </div>
      {/* CLV explanation */}
      <div className="bg-slate-800/30 rounded-xl p-3 border border-slate-800">
        <p className="text-slate-400 text-xs"><span className="text-indigo-400 font-semibold">Closing Line Value (CLV)</span> measures whether you got a better number than where the market settled. Positive CLV over a large sample is the strongest indicator of real edge — it shows you were ahead of sharp money, not just lucky on outcomes.</p>
      </div>
    </div>

    {/* Trend bars (simplified sparkline) */}
    <div>
      <SectionHeader title="Win Rate Trend" sub="Rolling 5-pick windows"/>
      <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-4">
        <div className="flex items-end gap-1 h-16">
          {picks.filter(p=>p.outcome!=='pending').slice(0,15).reverse().map((p,i)=>{
            const h=p.outcome==='win'?100:p.outcome==='loss'?20:50;
            return <div key={i} className="flex-1 rounded-sm transition-all" style={{height:`${h}%`,background:p.outcome==='win'?'#34d399':p.outcome==='loss'?'#f87171':'#64748b'}}/>;
          })}
        </div>
        <div className="flex justify-between mt-1">
          <span className="text-slate-500 text-[10px]">← Older</span>
          <span className="text-slate-500 text-[10px]">Recent →</span>
        </div>
        <div className="flex items-center gap-4 mt-2">
          <div className="flex items-center gap-1"><div className="w-2 h-2 rounded-sm bg-emerald-400"/><span className="text-slate-400 text-[10px]">Win</span></div>
          <div className="flex items-center gap-1"><div className="w-2 h-2 rounded-sm bg-rose-400"/><span className="text-slate-400 text-[10px]">Loss</span></div>
        </div>
      </div>
    </div>

    {/* Splits */}
    <SplitTable title="Performance by Sport" rows={sportSplits}/>
    <SplitTable title="Performance by Market" rows={mktSplits}/>

    {/* Best categories + leak alerts */}
    <div className="grid sm:grid-cols-2 gap-4">
      <div>
        <h4 className="text-emerald-400 text-xs font-bold tracking-wider uppercase mb-2">✅ Best Categories</h4>
        <div className="space-y-2">
          {best.length>0?best.map(r=>{
            const sport=SPORTS.find(s=>s.id===r.val);
            const label=sport?`${sport.icon} ${sport.label}`:r.val;
            return <div key={r.val} className="bg-emerald-500/5 border border-emerald-500/20 rounded-xl p-3">
              <p className="text-white font-semibold text-sm">{label}</p>
              <p className="text-emerald-400 font-black text-lg">{r.wr}%</p>
              <p className="text-slate-400 text-xs">{r.w}W–{r.l}L · CLV {r.clv>0?'+':''}{r.clv?.toFixed(1)||'—'} · {r.n} picks</p>
            </div>;
          }):<p className="text-slate-500 text-xs">Need 3+ picks in a category</p>}
        </div>
      </div>
      <div>
        <h4 className="text-rose-400 text-xs font-bold tracking-wider uppercase mb-2">⚠ Leak Alerts</h4>
        <div className="space-y-2">
          {leaks.length>0?leaks.map(r=>{
            const sport=SPORTS.find(s=>s.id===r.val);
            const label=sport?`${sport.icon} ${sport.label}`:r.val;
            return <div key={r.val} className="bg-rose-500/5 border border-rose-500/20 rounded-xl p-3">
              <p className="text-white font-semibold text-sm">{label}</p>
              <p className="text-rose-400 font-black text-lg">{r.wr}%</p>
              <p className="text-slate-400 text-xs">{r.w}W–{r.l}L · CLV {r.clv>0?'+':''}{r.clv?.toFixed(1)||'—'} · {r.n} picks</p>
            </div>;
          }):<p className="text-slate-500 text-xs">No significant leaks detected</p>}
        </div>
      </div>
    </div>

    {/* Sample size advisory */}
    <div className="bg-amber-500/5 border border-amber-500/20 rounded-xl p-4">
      <p className="text-amber-400 font-bold text-xs mb-1">⚠ Sample Size Advisory</p>
      <p className="text-slate-400 text-xs">You have {PICK_LOG.filter(p=>p.outcome!=='pending').length} settled picks. Short-run results are noisy — a 7-2 hot streak carries little predictive weight. CLV over 100+ picks is a more reliable signal of durable edge. Your SMART Rating confidence interval widens at lower sample sizes.</p>
    </div>
  </div>;
}

function MethodologyView(){

  return <div className="space-y-6 slide-up">
    {/* SMART Rating */}
    <div>

      <div className="grid sm:grid-cols-2 gap-3 mb-4">
        {[
          {icon:'📊',label:'Sample Size (20%)',desc:'More logged picks narrows the confidence interval. Ratings are unstable under 50 picks and flagged accordingly. Raw win streaks are discounted at low samples.'},
          {icon:'🎯',label:'Market Difficulty (30%)',desc:'Picking against sharp lines (low-vig, efficient markets) is harder. Wins on these carry more weight. Public-heavy markets are discounted in the model.'},
          {icon:'⚖️',label:'Stake Weight (25%)',desc:'Higher-confidence picks (larger implied stake) are weighted more. This prevents hedging behavior where users spread picks to inflate volume.'},
          {icon:'📅',label:'Recency (25%)',desc:'Recent performance is weighted higher to capture current edge, not just historical variance. The decay factor prevents living off a long-ago hot streak.'},
        ].map(f=><div key={f.label} className="bg-slate-900/60 border border-slate-800 rounded-xl p-4">
          <div className="flex items-center gap-2 mb-2"><span className="text-xl">{f.icon}</span><span className="text-white font-bold text-sm">{f.label}</span></div>

      <div className="bg-slate-800/30 rounded-xl p-4 border border-slate-800">
        <p className="text-slate-400 text-xs leading-relaxed">The SMART Rating is Elo/Glicko-inspired, with a global confidence interval that shrinks as sample grows. It does not use outcome-only models — CLV is factored in as a signal of market-beating behavior. Two predictors with the same win rate can have materially different ratings based on market difficulty and CLV.</p>

        <p className="text-slate-400 text-xs leading-relaxed">You picked -3.5 before the market moved to -4.5. You got a full point better than the closing number, meaning sharp money agreed with you — and then some. This is positive CLV regardless of outcome. Sustained positive CLV over 100+ picks is the strongest publicly-verifiable proof of edge.</p>
        <div className="flex items-center gap-2 mt-2">
          <div className="w-2 h-2 rounded-full bg-emerald-400"/>
          <p className="text-emerald-400 text-xs font-semibold">Market moved with you → Sharps agreed with your pick after entry</p>
        </div>
        <div className="flex items-center gap-2">
          <div className="w-2 h-2 rounded-full bg-rose-400"/>

        {TIER_DEFS.map(t=><div key={t.name} className="flex items-center gap-3 bg-slate-900/60 border border-slate-800 rounded-xl p-3.5">

        {computeBadges(ME.trades, computeStats(PICK_LOG)).map(b=>{
          const earned=true;
          return <div key={b.key} className={`flex items-start gap-3 p-3.5 rounded-xl border ${earned?'border-indigo-700/40 bg-indigo-950/30':'border-slate-800 bg-slate-900/40 opacity-50'}`}>
            <span className="text-2xl flex-shrink-0">{b.icon}</span>
            <div><p className="text-white font-bold text-sm">{b.label}</p><p className="text-slate-400 text-xs">{b.desc}</p></div>

          <div><p className="text-slate-400 font-bold text-sm">{b.label}</p><p className="text-slate-500 text-xs">{b.desc}</p></div>
          <span className="text-slate-600 text-xs font-bold ml-auto flex-shrink-0">Locked</span>
        </div>)}

    {/* Immutability policy */}
    <div className="bg-emerald-500/5 border border-emerald-500/20 rounded-xl p-5">
      <h4 className="text-emerald-400 font-bold text-sm mb-2">🔒 Immutability Policy</h4>
      <div className="space-y-2 text-slate-400 text-xs leading-relaxed">
        <p>• All picks are timestamped on submission with full metadata: event, market, line, odds, and submission time in UTC.</p>
        <p>• Picks lock automatically at event start time. No edits, deletions, or re-entries are permitted after lock.</p>
        <p>• Settlement is recorded with outcome, closing line, CLV, and rating delta — forming a permanent, tamper-evident log.</p>
        <p>• Public profile pages show the full record, including losses. Cherry-picked screenshots are not the record.</p>
        <p>• Pending picks are visible but clearly marked. Their outcome cannot be known or altered before lock.</p>
      </div>
    </div>
  </div>;
}

function CSVImportPanel({onDone}){
  const [step,setStep]=useState(0); // 0=idle,1=paste,2=preview,3=done
  const [raw,setRaw]=useState('');
  const [parsed,setParsed]=useState([]);

  function parse(){
    const lines=raw.trim().split('\n').slice(1).filter(Boolean);
    const rows=lines.map((l,i)=>{
      const [date,event,sport,market,pick,line,odds,outcome]=l.split(',');
      return {id:'imp'+i,date,event,sport,market,pick,line,odds,outcome:outcome?.trim()||'pending'};
    }).filter(r=>r.event&&r.pick);
    setParsed(rows); setStep(2);
  }
  function confirm(){ setStep(3); setTimeout(()=>{setStep(0);setRaw('');setParsed([]);if(onDone)onDone();},2500); }

  const inp='w-full bg-slate-800 border border-slate-700 text-white text-xs rounded-xl px-3 py-2.5 focus:outline-none focus:border-indigo-500 transition-colors font-mono';

  if(step===0) return <button onClick={()=>setStep(1)} className="flex items-center gap-2 px-4 py-2.5 rounded-xl border border-slate-700 hover:border-indigo-600 text-slate-400 hover:text-white text-sm font-semibold transition-colors">
    <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/></svg>
    Import picks from CSV / spreadsheet
  </button>;

  if(step===3) return <div className="flex items-center gap-3 p-4 bg-emerald-500/10 border border-emerald-500/30 rounded-xl fade-in">
    <span className="text-2xl">🔒</span>
    <div><p className="text-emerald-400 font-bold text-sm">{parsed.length} picks imported and timestamped</p><p className="text-slate-400 text-xs">Locked at import time. Appear in your immutable record.</p></div>
  </div>;

  return <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-5 space-y-4 slide-up">
    <div className="flex items-center justify-between">
      <h4 className="text-white font-bold text-sm">Import Picks</h4>
      <button onClick={()=>{setStep(0);setRaw('');setParsed([]);}} className="text-slate-500 hover:text-white text-xs">Cancel</button>
    </div>

    {step===1&&<>
      <div>
        <p className="text-slate-400 text-xs mb-2">Template (copy from your spreadsheet in this format):</p>
        <pre className="text-indigo-300 text-[10px] bg-slate-800 rounded-lg p-3 overflow-x-auto whitespace-pre font-mono leading-relaxed">{CSV_TEMPLATE}</pre>
      </div>
      <div>
        <p className="text-slate-400 text-xs mb-1">Paste your picks CSV here:</p>
        <textarea value={raw} onChange={e=>setRaw(e.target.value)} rows={6} placeholder="Paste CSV rows here (including header)…" className={inp}/>
      </div>
      <button onClick={parse} disabled={!raw.trim()} className="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 disabled:cursor-not-allowed text-white font-bold text-sm transition-colors">
        Parse & Preview →
      </button>
    </>}

    {step===2&&<>
      <p className="text-slate-400 text-xs">{parsed.length} picks parsed. Review before import — once confirmed, picks are timestamped and locked.</p>
      <div className="max-h-48 overflow-y-auto space-y-1.5">
        {parsed.map(p=><div key={p.id} className="flex items-center gap-3 bg-slate-800/60 rounded-lg px-3 py-2 text-xs">
          <span className="text-slate-400 w-16 flex-shrink-0">{p.date}</span>
          <span className="text-white flex-1 truncate font-medium">{p.event}</span>
          <span className="text-indigo-300">{p.market}</span>
          <span className="text-slate-300">{p.pick}</span>
          <span className={`font-bold flex-shrink-0 ${p.outcome==='win'?'text-emerald-400':p.outcome==='loss'?'text-rose-400':'text-amber-400'}`}>{p.outcome}</span>
        </div>)}
      </div>
      <div className="flex gap-2">
        <button onClick={()=>setStep(1)} className="flex-1 py-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-white font-bold text-sm transition-colors">← Back</button>
        <button onClick={confirm} className="flex-1 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm transition-colors">🔒 Import & Lock {parsed.length} Picks</button>
      </div>
    </>}
  </div>;
}
